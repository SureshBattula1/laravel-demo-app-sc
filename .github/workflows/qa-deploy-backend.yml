name: Deploy Laravel Backend to AWS EC2

on:
  push:
    branches:
      - api-v1-4.0 # Triggers automatically when code is merged into main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      # 1. Install dependencies on GitHub runner
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-req=php

      # 2. Sync updated source code to your EC2 server (excluding environment, storage, and vendor)
      - name: Sync files to server using rsync
        uses: easingthemes/ssh-deploy@v5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.QA_SERVER_SSH_KEY }}
          ARGS: "-rltgoDzv --delete --exclude='.env' --exclude='storage/' --exclude='vendor/'"
          SOURCE: "."
          REMOTE_HOST: ${{ secrets.QA_SERVER_HOST }}
          REMOTE_USER: ${{ secrets.QA_SERVER_USER }}
          TARGET: "/var/www/qa/api"

      # 3. Run post-deployment maintenance commands on EC2
      - name: Run Post-Deployment Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SERVER_HOST }}
          username: ${{ secrets.QA_SERVER_USER }}
          key: ${{ secrets.QA_SERVER_SSH_KEY }}
          script: |
            cd /var/www/qa/api
            
            # Install production vendor dependencies on the server
            composer install --no-dev --optimize-autoloader --ignore-platform-req=php
            
            # Ensure storage & cache permissions are maintained
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            
            # Run database migrations and refresh configuration caches
            php artisan migrate --force
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Reload PHP-FPM to clear OPcache
            sudo systemctl reload php8.5-fpm
